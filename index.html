<title>Pendulum Board</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap">
<style>
  /* Layout: full-screen app, board centered, controls docked bottom */
  :root {
    --bg: #0a0a0f;
    --check-a: #e8a0c8;
    --check-b: #b5dda4;
    --fg: #e8e6e1;
    --surface: #16161e;
    --border: #2a2a35;
    --accent: #5b8def;
    --muted: #6b6b7b;
    --board-bg: #f5f3ee;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f0eeea;
      --fg: #1a1a1f;
      --surface: #ffffff;
      --border: #d8d5ce;
      --accent: #3d6fd6;
      --muted: #8a8a95;
      --board-bg: #ffffff;
      --check-a: #e625a3;
      --check-b: #6fde3c;
      color-scheme: light;
    }
  }
  :root[data-theme="light"] {
    --bg: #f0eeea;
    --fg: #1a1a1f;
    --surface: #ffffff;
    --border: #d8d5ce;
    --accent: #3d6fd6;
    --muted: #8a8a95;
    --board-bg: #ffffff;
    --check-a: #e8a0c8;
    --check-b: #b5dda4;
    color-scheme: light;
  }

  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: 'DM Sans', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 12px;
    gap: 12px;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
  }

  .header {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    text-align: center;
  }

  .canvas-wrap {
    position: relative;
    flex: 1 1 0;
    min-height: 0;
    width: 100%;
    max-width: 800px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  canvas#board {
    border-radius: 6px;
    cursor: none;
    touch-action: none;
  }
  #cursor {
    position: fixed;
    pointer-events: none;
    z-index: 50;
    transform: translate(-50%, -50%);
    transition: width 0.1s, height 0.1s, border-radius 0.1s;
  }
  #cursor.square {
    width: 16px; height: 16px;
    border: none;
    border-radius: 2px;
    background: var(--fg);
  }
  #cursor.hand {
    width: 0; height: 0;
    border: none;
    background: none;
  }
  #cursor.dot {
    width: 8px; height: 8px;
    border: none;
    border-radius: 50%;
    background: var(--fg);
    transform: translate(3px, -2px);
  }

  .controls {
    position: fixed;
    right: max(16px, env(safe-area-inset-right, 0px));
    top: max(12px, env(safe-area-inset-top, 0px));
    z-index: 10;
  }

  .help-btn {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--muted);
    font-family: 'Space Mono', monospace;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s;
  }
  .help-btn:hover { background: var(--accent); color: #fff; }

  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: max(16px, env(safe-area-inset-left, 0px));
  }
  .modal {
    background: var(--surface);
    border-radius: 12px;
    padding: 28px 24px;
    max-width: 340px;
    width: 100%;
    font-family: 'DM Sans', sans-serif;
    color: var(--fg);
    line-height: 1.6;
  }
  .modal h2 {
    font-family: 'Space Mono', monospace;
    font-size: 13px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 16px;
  }
  .modal p {
    margin: 0 0 12px;
    font-size: 14px;
  }
  .modal p:last-of-type { margin-bottom: 0; }
  .modal strong { color: var(--accent); }
  .modal-close {
    margin-top: 20px;
    width: 100%;
    padding: 8px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--fg);
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.05em;
    cursor: pointer;
    transition: background 0.15s;
  }
  .modal-close:hover { background: var(--accent); color: #fff; }

  .action-btn {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.05em;
    padding: 6px 14px;
    border-radius: 4px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--fg);
    cursor: pointer;
    transition: background 0.15s;
  }
  .action-btn:hover { background: var(--accent); color: #fff; }
  .action-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .pen-size {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.05em;
  }
  .pen-size input[type="range"] {
    width: 80px;
    accent-color: var(--accent);
    writing-mode: vertical-lr;
    direction: rtl;
  }

  .hint {
    font-size: 11px;
    color: var(--muted);
    text-align: center;
    font-family: 'Space Mono', monospace;
    letter-spacing: 0.03em;
  }
</style>

<div id="cursor" class="square"></div>
<div class="header">Pendulum Board</div>

<div class="canvas-wrap">
  <canvas id="board"></canvas>
</div>

<div class="controls">
  <button class="help-btn" id="helpBtn" aria-label="Help">?</button>
</div>

<div class="modal-overlay" id="helpModal" hidden>
  <div class="modal">
    <h2>How to play</h2>
    <p><strong>Grab a corner</strong> of the white board and drag to set it swinging.</p>
    <p><strong>Click &amp; hold</strong> anywhere on the board to scratch away the surface and reveal the hidden image underneath.</p>
    <button class="modal-close" id="closeHelp">Got it</button>
  </div>
</div>

<script>
(function() {
  const canvas = document.getElementById('board');
  const ctx = canvas.getContext('2d');
  const wrap = canvas.parentElement;

  let W, H;
  let CW, CH;
  let patternCanvas, patternCtx;
  let maskCanvas, maskCtx;

  // Board physics
  let angleX = 0, angleY = 0;
  let velX = 0, velY = 0;
  const damping = 0.9988;
  const gravityX = 1.4;
  const gravityY = 2.1;
  const maxAngle = 0.25;

  // Pen state
  let penSize = 12;
  let isDrawing = false;
  let isDragging = false;
  let lastDrawX = null, lastDrawY = null;

  let imageList = [];
  let currentImage = null;

  async function loadManifest() {
    try {
      const resp = await fetch('images/manifest.json');
      const list = await resp.json();
      if (Array.isArray(list) && list.length > 0) {
        imageList = list;
      }
    } catch (e) {}
  }

  function loadRandomImage() {
    return new Promise((resolve) => {
      if (imageList.length === 0) { resolve(null); return; }
      const file = imageList[Math.floor(Math.random() * imageList.length)];
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = () => resolve(null);
      img.src = 'images/' + file;
    });
  }

  function drawImageCover(ctx, img, w, h) {
    const imgAspect = img.naturalWidth / img.naturalHeight;
    const canvasAspect = w / h;
    let sx, sy, sw, sh;
    if (imgAspect > canvasAspect) {
      sh = img.naturalHeight;
      sw = sh * canvasAspect;
      sx = (img.naturalWidth - sw) / 2;
      sy = 0;
    } else {
      sw = img.naturalWidth;
      sh = sw / canvasAspect;
      sx = 0;
      sy = (img.naturalHeight - sh) / 2;
    }
    ctx.drawImage(img, sx, sy, sw, sh, 0, 0, w, h);
  }

  const washColors = ['#3b5323', '#e36356', '#6b8fa3', '#d4c953'];

  function generatePattern() {
    if (currentImage) {
      drawImageCover(patternCtx, currentImage, W, H);
      return;
    }
    // Generative color wash using the four palette colors
    patternCtx.fillStyle = '#f4f1e8';
    patternCtx.fillRect(0, 0, W, H);

    // Large soft blobs
    for (let i = 0; i < 14; i++) {
      const x = Math.random() * W;
      const y = Math.random() * H;
      const r = 60 + Math.random() * Math.min(W, H) * 0.5;
      const g = patternCtx.createRadialGradient(x, y, 0, x, y, r);
      const c = washColors[i % 4];
      g.addColorStop(0, c + '66');
      g.addColorStop(0.5, c + '30');
      g.addColorStop(1, 'transparent');
      patternCtx.fillStyle = g;
      patternCtx.beginPath();
      patternCtx.arc(x, y, r, 0, Math.PI * 2);
      patternCtx.fill();
    }

    // Second pass for depth
    for (let i = 0; i < 20; i++) {
      const x = Math.random() * W;
      const y = Math.random() * H;
      const r = 40 + Math.random() * Math.min(W, H) * 0.35;
      const g = patternCtx.createRadialGradient(x, y, 0, x, y, r);
      const c = washColors[Math.floor(Math.random() * 2)];
      g.addColorStop(0, c + '77');
      g.addColorStop(0.6, c + '33');
      g.addColorStop(1, 'transparent');
      patternCtx.fillStyle = g;
      patternCtx.beginPath();
      patternCtx.arc(x, y, r, 0, Math.PI * 2);
      patternCtx.fill();
    }
  }

  function initMask() {
    const boardBg = getComputedStyle(document.documentElement).getPropertyValue('--board-bg').trim();
    maskCtx.fillStyle = boardBg;
    maskCtx.fillRect(0, 0, W, H);
  }

  function resize() {
    const rect = wrap.getBoundingClientRect();
    CW = Math.floor(Math.min(rect.width - 8, 800));
    CH = Math.floor(rect.height - 8);
    const maxSwingFrac = Math.sin(maxAngle) * 1.0;
    const aspect = 4 / 3;
    const fitW = CW / (1 + 2 * maxSwingFrac);
    const fitH = CH / (1 + 2 * maxSwingFrac);
    if (fitW / aspect <= fitH) {
      W = Math.floor(fitW);
      H = Math.floor(fitW / aspect);
    } else {
      H = Math.floor(fitH);
      W = Math.floor(fitH * aspect);
    }

    canvas.width = CW * devicePixelRatio;
    canvas.height = CH * devicePixelRatio;
    canvas.style.width = CW + 'px';
    canvas.style.height = CH + 'px';
    ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);

    const needsInit = !patternCanvas;

    if (!patternCanvas) {
      patternCanvas = document.createElement('canvas');
      patternCtx = patternCanvas.getContext('2d');
      maskCanvas = document.createElement('canvas');
      maskCtx = maskCanvas.getContext('2d');
    }

    patternCanvas.width = W * devicePixelRatio;
    patternCanvas.height = H * devicePixelRatio;
    patternCtx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);

    const oldMask = needsInit ? null : maskCtx.getImageData(0, 0, maskCanvas.width, maskCanvas.height);
    maskCanvas.width = W * devicePixelRatio;
    maskCanvas.height = H * devicePixelRatio;
    maskCtx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);

    generatePattern();

    if (oldMask) {
      maskCtx.putImageData(oldMask, 0, 0);
    } else {
      initMask();
    }
  }

  function boardOffset() {
    const restX = (CW - W) / 2;
    const restY = (CH - H) / 2;
    return {
      x: restX + Math.sin(angleX) * W * 1.0,
      y: restY + Math.sin(angleY) * H * 1.0
    };
  }

  // Ambient drift — keeps the board gently floating
  let driftPhaseX = Math.random() * Math.PI * 2;
  let driftPhaseY = Math.random() * Math.PI * 2;

  function updatePhysics(dt) {
    const step = Math.min(dt, 0.033);
    driftPhaseX += step * 0.7;
    driftPhaseY += step * 0.5;
    velX += Math.sin(driftPhaseX) * 0.0004;
    velY += Math.cos(driftPhaseY) * 0.0003;
    velX += -gravityX * angleX * step;
    velY += -gravityY * angleY * step;
    velX *= Math.pow(damping, step * 60);
    velY *= Math.pow(damping, step * 60);
    angleX += velX * step;
    angleY += velY * step;
    angleX = Math.max(-maxAngle, Math.min(maxAngle, angleX));
    angleY = Math.max(-maxAngle, Math.min(maxAngle, angleY));
  }

  function eraseMask(x0, y0, x1, y1) {
    maskCtx.save();
    maskCtx.globalCompositeOperation = 'destination-out';
    maskCtx.strokeStyle = 'rgba(255,255,255,1)';
    maskCtx.lineWidth = penSize;
    maskCtx.lineCap = 'round';
    maskCtx.lineJoin = 'round';
    maskCtx.beginPath();
    maskCtx.moveTo(x0, y0);
    maskCtx.lineTo(x1, y1);
    maskCtx.stroke();
    maskCtx.restore();
  }

  function eraseDot(x, y) {
    maskCtx.save();
    maskCtx.globalCompositeOperation = 'destination-out';
    maskCtx.fillStyle = 'rgba(255,255,255,1)';
    maskCtx.beginPath();
    maskCtx.arc(x, y, penSize / 2, 0, Math.PI * 2);
    maskCtx.fill();
    maskCtx.restore();
  }

  function render() {
    ctx.clearRect(0, 0, CW, CH);
    const off = boardOffset();

    ctx.save();
    ctx.translate(off.x, off.y);

    // Drop shadow
    ctx.shadowColor = 'rgba(0,0,0,0.25)';
    ctx.shadowBlur = 30;
    ctx.shadowOffsetX = 0;
    ctx.shadowOffsetY = 8;
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.roundRect(0, 0, W, H, 12);
    ctx.fill();
    ctx.shadowColor = 'transparent';

    ctx.beginPath();
    ctx.roundRect(0, 0, W, H, 12);
    ctx.clip();

    // Draw the hidden pattern
    ctx.drawImage(patternCanvas, 0, 0, patternCanvas.width, patternCanvas.height, 0, 0, W, H);

    // Draw the mask (white overlay) on top — erased areas reveal pattern
    ctx.drawImage(maskCanvas, 0, 0, maskCanvas.width, maskCanvas.height, 0, 0, W, H);

    ctx.restore();
  }

  // Interaction
  function isNearCorner(bx, by) {
    const zone = Math.min(W, H) * 0.2;
    const corners = [[0,0],[W,0],[0,H],[W,H]];
    for (const [cx, cy] of corners) {
      const dx = bx - cx, dy = by - cy;
      if (dx * dx + dy * dy < zone * zone) return true;
    }
    return false;
  }

  function onPointerDown(e) {
    if (e.button !== 0) return;
    canvas.setPointerCapture(e.pointerId);
    penScreenX = e.clientX;
    penScreenY = e.clientY;

    const rect = canvas.getBoundingClientRect();
    const off = boardOffset();
    const bx = penScreenX - rect.left - off.x;
    const by = penScreenY - rect.top - off.y;

    if (bx >= 0 && bx <= W && by >= 0 && by <= H && isNearCorner(bx, by)) {
      isDragging = true;
      velX = 0;
      velY = 0;
    } else {
      isDrawing = true;
      lastDrawX = bx;
      lastDrawY = by;
      eraseDot(bx, by);
    }
  }

  function onPointerMove(e) {
    const prevX = penScreenX, prevY = penScreenY;
    penScreenX = e.clientX;
    penScreenY = e.clientY;

    if (isDragging) {
      const dx = (penScreenX - prevX) / W;
      const dy = (penScreenY - prevY) / H;
      angleX += dx * 0.6;
      angleY += dy * 0.6;
      angleX = Math.max(-maxAngle, Math.min(maxAngle, angleX));
      angleY = Math.max(-maxAngle, Math.min(maxAngle, angleY));
    }
  }

  function onPointerUp(e) {
    if (isDragging) {
      velX = cursorVelX * 0.012;
      velY = cursorVelY * 0.012;
      isDragging = false;
    }
    isDrawing = false;
    lastDrawX = null;
    lastDrawY = null;
  }

  canvas.addEventListener('pointerdown', onPointerDown);
  canvas.addEventListener('pointermove', onPointerMove);
  canvas.addEventListener('pointerup', onPointerUp);
  canvas.addEventListener('pointercancel', onPointerUp);

  let penScreenX = 0, penScreenY = 0;
  let prevScreenX = 0, prevScreenY = 0;
  let cursorVelX = 0, cursorVelY = 0;

  const cursorEl = document.getElementById('cursor');
  document.addEventListener('mousemove', (e) => {
    cursorEl.style.left = e.clientX + 'px';
    cursorEl.style.top = e.clientY + 'px';
  });

  function updateCursor() {
    if (isDragging) {
      cursorEl.className = 'dot';
      canvas.style.cursor = 'grabbing';
      return;
    }
    if (isDrawing) {
      cursorEl.className = 'dot';
      canvas.style.cursor = 'pointer';
      return;
    }
    const rect = canvas.getBoundingClientRect();
    const off = boardOffset();
    const bx = penScreenX - rect.left - off.x;
    const by = penScreenY - rect.top - off.y;
    if (bx >= 0 && bx <= W && by >= 0 && by <= H) {
      cursorEl.className = 'hand';
      canvas.style.cursor = 'grab';
    } else {
      cursorEl.className = 'square';
      canvas.style.cursor = 'none';
    }
  }

  const helpModal = document.getElementById('helpModal');
  document.getElementById('helpBtn').addEventListener('click', () => { helpModal.hidden = false; });
  document.getElementById('closeHelp').addEventListener('click', () => { helpModal.hidden = true; });
  helpModal.addEventListener('click', (e) => { if (e.target === helpModal) helpModal.hidden = true; });

  // Main loop
  let lastTime = performance.now();

  function loop(now) {
    const dt = (now - lastTime) / 1000;
    lastTime = now;

    cursorVelX = penScreenX - prevScreenX;
    cursorVelY = penScreenY - prevScreenY;
    prevScreenX = penScreenX;
    prevScreenY = penScreenY;

    if (!isDragging) updatePhysics(dt);
    const offAfter = boardOffset();

    if (isDrawing && lastDrawX !== null) {
      const rect = canvas.getBoundingClientRect();
      const cursorBoardX = penScreenX - rect.left - offAfter.x;
      const cursorBoardY = penScreenY - rect.top - offAfter.y;
      eraseMask(lastDrawX, lastDrawY, cursorBoardX, cursorBoardY);
      lastDrawX = cursorBoardX;
      lastDrawY = cursorBoardY;
    }

    render();
    updateCursor();
    requestAnimationFrame(loop);
  }

  async function init() {
    await loadManifest();
    currentImage = await loadRandomImage();
    resize();
    window.addEventListener('resize', resize);
    requestAnimationFrame(loop);
  }
  init();
})();
</script>
