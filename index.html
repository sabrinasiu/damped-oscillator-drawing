<title>Pendulum Board</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap">
<style>
  /* Layout: full-screen app, board centered, controls docked bottom */
  :root {
    --bg: #0a0a0f;
    --check-a: #e8a0c8;
    --check-b: #b5dda4;
    --fg: #e8e6e1;
    --surface: #16161e;
    --border: #2a2a35;
    --accent: #5b8def;
    --muted: #6b6b7b;
    --board-bg: #f5f3ee;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f0eeea;
      --fg: #1a1a1f;
      --surface: #ffffff;
      --border: #d8d5ce;
      --accent: #3d6fd6;
      --muted: #8a8a95;
      --board-bg: #ffffff;
      --check-a: #e625a3;
      --check-b: #6fde3c;
      color-scheme: light;
    }
  }
  :root[data-theme="light"] {
    --bg: #f0eeea;
    --fg: #1a1a1f;
    --surface: #ffffff;
    --border: #d8d5ce;
    --accent: #3d6fd6;
    --muted: #8a8a95;
    --board-bg: #ffffff;
    --check-a: #e8a0c8;
    --check-b: #b5dda4;
    color-scheme: light;
  }

  #bgCanvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
  }

  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: 'DM Sans', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 12px;
    gap: 12px;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
  }

  .header {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    text-align: center;
  }

  .canvas-wrap {
    position: relative;
    flex: 1 1 0;
    min-height: 0;
    width: 100%;
    max-width: 800px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  canvas#board {
    border-radius: 6px;
    cursor: grab;
    touch-action: none;
  }

  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    justify-content: center;
    max-width: 700px;
    width: 100%;
  }

  .action-btn {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.05em;
    padding: 6px 14px;
    border-radius: 4px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--fg);
    cursor: pointer;
    transition: background 0.15s;
  }
  .action-btn:hover { background: var(--accent); color: #fff; }
  .action-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .pen-size {
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.05em;
  }
  .pen-size input[type="range"] {
    width: 80px;
    accent-color: var(--accent);
  }

  .hint {
    font-size: 11px;
    color: var(--muted);
    text-align: center;
    font-family: 'Space Mono', monospace;
    letter-spacing: 0.03em;
  }
</style>

<canvas id="bgCanvas"></canvas>
<div class="header">Pendulum Board</div>

<div class="canvas-wrap">
  <canvas id="board"></canvas>
</div>

<div class="controls">
  <div class="pen-size">
    <label for="penSize">ERASER</label>
    <input type="range" id="penSize" min="4" max="30" value="12">
  </div>
  <button class="action-btn" id="clearBtn">Reset</button>
</div>

<div class="hint">Grab a corner to swing the board, click &amp; hold to reveal the hidden image</div>

<script>
(function() {
  const bgC = document.getElementById('bgCanvas');
  const bgX = bgC.getContext('2d');

  const palette = {
    oil:     '#3b5323',
    coral:   '#e36356',
    glaucous:'#6b8fa3',
    sulphur: '#d4c953'
  };
  const colors = Object.values(palette);

  function drawBg() {
    const w = bgC.width = window.innerWidth * devicePixelRatio;
    const h = bgC.height = window.innerHeight * devicePixelRatio;
    bgC.style.width = window.innerWidth + 'px';
    bgC.style.height = window.innerHeight + 'px';
    bgX.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
    const W = window.innerWidth, H = window.innerHeight;

    // Base wash
    bgX.fillStyle = '#f4f1e8';
    bgX.fillRect(0, 0, W, H);

    // Large soft blobs
    for (let i = 0; i < 12; i++) {
      const x = Math.random() * W;
      const y = Math.random() * H;
      const r = 80 + Math.random() * 250;
      const g = bgX.createRadialGradient(x, y, 0, x, y, r);
      const c = colors[i % 4];
      g.addColorStop(0, c + '55');
      g.addColorStop(0.6, c + '22');
      g.addColorStop(1, 'transparent');
      bgX.fillStyle = g;
      bgX.beginPath();
      bgX.arc(x, y, r, 0, Math.PI * 2);
      bgX.fill();
    }

    // More overlapping color washes
    for (let i = 0; i < 18; i++) {
      const x = Math.random() * W;
      const y = Math.random() * H;
      const r = 100 + Math.random() * 350;
      const g = bgX.createRadialGradient(x, y, 0, x, y, r);
      const c = colors[Math.floor(Math.random() * 4)];
      g.addColorStop(0, c + '44');
      g.addColorStop(0.5, c + '18');
      g.addColorStop(1, 'transparent');
      bgX.fillStyle = g;
      bgX.beginPath();
      bgX.arc(x, y, r, 0, Math.PI * 2);
      bgX.fill();
    }
  }

  drawBg();
  window.addEventListener('resize', drawBg);
})();

(function() {
  const canvas = document.getElementById('board');
  const ctx = canvas.getContext('2d');
  const wrap = canvas.parentElement;

  let W, H;
  let CW, CH;
  let patternCanvas, patternCtx;
  let maskCanvas, maskCtx;

  // Board physics
  let angleX = 0, angleY = 0;
  let velX = 0, velY = 0;
  const damping = 0.9988;
  const gravityX = 1.4;
  const gravityY = 2.1;
  const maxAngle = 0.25;

  // Pen state
  let penSize = 12;
  let isDrawing = false;
  let isDragging = false;
  let lastDrawX = null, lastDrawY = null;

  let imageList = [];
  let currentImage = null;

  async function loadManifest() {
    try {
      const resp = await fetch('images/manifest.json');
      const list = await resp.json();
      if (Array.isArray(list) && list.length > 0) {
        imageList = list;
      }
    } catch (e) {}
  }

  function loadRandomImage() {
    return new Promise((resolve) => {
      if (imageList.length === 0) { resolve(null); return; }
      const file = imageList[Math.floor(Math.random() * imageList.length)];
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = () => resolve(null);
      img.src = 'images/' + file;
    });
  }

  function drawImageCover(ctx, img, w, h) {
    const imgAspect = img.naturalWidth / img.naturalHeight;
    const canvasAspect = w / h;
    let sx, sy, sw, sh;
    if (imgAspect > canvasAspect) {
      sh = img.naturalHeight;
      sw = sh * canvasAspect;
      sx = (img.naturalWidth - sw) / 2;
      sy = 0;
    } else {
      sw = img.naturalWidth;
      sh = sw / canvasAspect;
      sx = 0;
      sy = (img.naturalHeight - sh) / 2;
    }
    ctx.drawImage(img, sx, sy, sw, sh, 0, 0, w, h);
  }

  const washColors = ['#3b5323', '#e36356', '#6b8fa3', '#d4c953'];

  function generatePattern() {
    if (currentImage) {
      drawImageCover(patternCtx, currentImage, W, H);
      return;
    }
    // Generative color wash using the four palette colors
    patternCtx.fillStyle = '#f4f1e8';
    patternCtx.fillRect(0, 0, W, H);

    // Large soft blobs
    for (let i = 0; i < 14; i++) {
      const x = Math.random() * W;
      const y = Math.random() * H;
      const r = 60 + Math.random() * Math.min(W, H) * 0.5;
      const g = patternCtx.createRadialGradient(x, y, 0, x, y, r);
      const c = washColors[i % 4];
      g.addColorStop(0, c + '66');
      g.addColorStop(0.5, c + '30');
      g.addColorStop(1, 'transparent');
      patternCtx.fillStyle = g;
      patternCtx.beginPath();
      patternCtx.arc(x, y, r, 0, Math.PI * 2);
      patternCtx.fill();
    }

    // Second pass for depth
    for (let i = 0; i < 20; i++) {
      const x = Math.random() * W;
      const y = Math.random() * H;
      const r = 40 + Math.random() * Math.min(W, H) * 0.35;
      const g = patternCtx.createRadialGradient(x, y, 0, x, y, r);
      const c = washColors[Math.floor(Math.random() * 4)];
      g.addColorStop(0, c + '44');
      g.addColorStop(0.6, c + '18');
      g.addColorStop(1, 'transparent');
      patternCtx.fillStyle = g;
      patternCtx.beginPath();
      patternCtx.arc(x, y, r, 0, Math.PI * 2);
      patternCtx.fill();
    }
  }

  function initMask() {
    const boardBg = getComputedStyle(document.documentElement).getPropertyValue('--board-bg').trim();
    maskCtx.fillStyle = boardBg;
    maskCtx.fillRect(0, 0, W, H);
  }

  function resize() {
    const rect = wrap.getBoundingClientRect();
    CW = Math.floor(Math.min(rect.width - 8, 800));
    CH = Math.floor(rect.height - 8);
    const maxSwingFrac = Math.sin(maxAngle) * 1.0;
    const aspect = 4 / 3;
    const fitW = CW / (1 + 2 * maxSwingFrac);
    const fitH = CH / (1 + 2 * maxSwingFrac);
    if (fitW / aspect <= fitH) {
      W = Math.floor(fitW);
      H = Math.floor(fitW / aspect);
    } else {
      H = Math.floor(fitH);
      W = Math.floor(fitH * aspect);
    }

    canvas.width = CW * devicePixelRatio;
    canvas.height = CH * devicePixelRatio;
    canvas.style.width = CW + 'px';
    canvas.style.height = CH + 'px';
    ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);

    const needsInit = !patternCanvas;

    if (!patternCanvas) {
      patternCanvas = document.createElement('canvas');
      patternCtx = patternCanvas.getContext('2d');
      maskCanvas = document.createElement('canvas');
      maskCtx = maskCanvas.getContext('2d');
    }

    patternCanvas.width = W * devicePixelRatio;
    patternCanvas.height = H * devicePixelRatio;
    patternCtx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);

    const oldMask = needsInit ? null : maskCtx.getImageData(0, 0, maskCanvas.width, maskCanvas.height);
    maskCanvas.width = W * devicePixelRatio;
    maskCanvas.height = H * devicePixelRatio;
    maskCtx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);

    generatePattern();

    if (oldMask) {
      maskCtx.putImageData(oldMask, 0, 0);
    } else {
      initMask();
    }
  }

  function boardOffset() {
    const restX = (CW - W) / 2;
    const restY = (CH - H) / 2;
    return {
      x: restX + Math.sin(angleX) * W * 1.0,
      y: restY + Math.sin(angleY) * H * 1.0
    };
  }

  function updatePhysics(dt) {
    const step = Math.min(dt, 0.033);
    velX += -gravityX * angleX * step;
    velY += -gravityY * angleY * step;
    velX *= Math.pow(damping, step * 60);
    velY *= Math.pow(damping, step * 60);
    angleX += velX * step;
    angleY += velY * step;
    angleX = Math.max(-maxAngle, Math.min(maxAngle, angleX));
    angleY = Math.max(-maxAngle, Math.min(maxAngle, angleY));
  }

  function eraseMask(x0, y0, x1, y1) {
    maskCtx.save();
    maskCtx.globalCompositeOperation = 'destination-out';
    maskCtx.strokeStyle = 'rgba(255,255,255,1)';
    maskCtx.lineWidth = penSize;
    maskCtx.lineCap = 'round';
    maskCtx.lineJoin = 'round';
    maskCtx.beginPath();
    maskCtx.moveTo(x0, y0);
    maskCtx.lineTo(x1, y1);
    maskCtx.stroke();
    maskCtx.restore();
  }

  function eraseDot(x, y) {
    maskCtx.save();
    maskCtx.globalCompositeOperation = 'destination-out';
    maskCtx.fillStyle = 'rgba(255,255,255,1)';
    maskCtx.beginPath();
    maskCtx.arc(x, y, penSize / 2, 0, Math.PI * 2);
    maskCtx.fill();
    maskCtx.restore();
  }

  function render() {
    ctx.clearRect(0, 0, CW, CH);
    const off = boardOffset();

    ctx.save();
    ctx.translate(off.x, off.y);
    ctx.beginPath();
    ctx.roundRect(0, 0, W, H, 12);
    ctx.clip();

    // Draw the hidden pattern
    ctx.drawImage(patternCanvas, 0, 0, patternCanvas.width, patternCanvas.height, 0, 0, W, H);

    // Draw the mask (white overlay) on top — erased areas reveal pattern
    ctx.drawImage(maskCanvas, 0, 0, maskCanvas.width, maskCanvas.height, 0, 0, W, H);

    ctx.restore();
  }

  // Interaction
  function isNearCorner(bx, by) {
    const zone = Math.min(W, H) * 0.2;
    const corners = [[0,0],[W,0],[0,H],[W,H]];
    for (const [cx, cy] of corners) {
      const dx = bx - cx, dy = by - cy;
      if (dx * dx + dy * dy < zone * zone) return true;
    }
    return false;
  }

  function onPointerDown(e) {
    if (e.button !== 0) return;
    canvas.setPointerCapture(e.pointerId);
    penScreenX = e.clientX;
    penScreenY = e.clientY;

    const rect = canvas.getBoundingClientRect();
    const off = boardOffset();
    const bx = penScreenX - rect.left - off.x;
    const by = penScreenY - rect.top - off.y;

    if (bx >= 0 && bx <= W && by >= 0 && by <= H && isNearCorner(bx, by)) {
      isDragging = true;
      canvas.style.cursor = 'grabbing';
      velX = 0;
      velY = 0;
    } else {
      isDrawing = true;
      canvas.style.cursor = 'crosshair';
      lastDrawX = bx;
      lastDrawY = by;
      eraseDot(bx, by);
    }
  }

  function onPointerMove(e) {
    const prevX = penScreenX, prevY = penScreenY;
    penScreenX = e.clientX;
    penScreenY = e.clientY;

    if (isDragging) {
      const dx = (penScreenX - prevX) / W;
      const dy = (penScreenY - prevY) / H;
      angleX += dx * 0.6;
      angleY += dy * 0.6;
      angleX = Math.max(-maxAngle, Math.min(maxAngle, angleX));
      angleY = Math.max(-maxAngle, Math.min(maxAngle, angleY));
    }
  }

  function onPointerUp(e) {
    if (isDragging) {
      velX = cursorVelX * 0.012;
      velY = cursorVelY * 0.012;
      isDragging = false;
    }
    isDrawing = false;
    canvas.style.cursor = 'grab';
    lastDrawX = null;
    lastDrawY = null;
  }

  canvas.addEventListener('pointerdown', onPointerDown);
  canvas.addEventListener('pointermove', onPointerMove);
  canvas.addEventListener('pointerup', onPointerUp);
  canvas.addEventListener('pointercancel', onPointerUp);

  let penScreenX = 0, penScreenY = 0;
  let prevScreenX = 0, prevScreenY = 0;
  let cursorVelX = 0, cursorVelY = 0;

  document.getElementById('penSize').addEventListener('input', e => {
    penSize = parseInt(e.target.value);
  });

  document.getElementById('clearBtn').addEventListener('click', async () => {
    currentImage = await loadRandomImage();
    generatePattern();
    initMask();
  });

  // Main loop
  let lastTime = performance.now();

  function loop(now) {
    const dt = (now - lastTime) / 1000;
    lastTime = now;

    cursorVelX = penScreenX - prevScreenX;
    cursorVelY = penScreenY - prevScreenY;
    prevScreenX = penScreenX;
    prevScreenY = penScreenY;

    if (!isDragging) updatePhysics(dt);
    const offAfter = boardOffset();

    if (isDrawing && lastDrawX !== null) {
      const rect = canvas.getBoundingClientRect();
      const cursorBoardX = penScreenX - rect.left - offAfter.x;
      const cursorBoardY = penScreenY - rect.top - offAfter.y;
      eraseMask(lastDrawX, lastDrawY, cursorBoardX, cursorBoardY);
      lastDrawX = cursorBoardX;
      lastDrawY = cursorBoardY;
    }

    render();
    requestAnimationFrame(loop);
  }

  async function init() {
    await loadManifest();
    currentImage = await loadRandomImage();
    resize();
    window.addEventListener('resize', resize);
    requestAnimationFrame(loop);
  }
  init();
})();
</script>
