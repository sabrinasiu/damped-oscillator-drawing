<title>Penduloom</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap">
<style>
  /* Layout: full-screen app, board centered, controls docked bottom */
  :root {
    --bg: #0a0a0f;
    --check-a: #e8a0c8;
    --check-b: #b5dda4;
    --fg: #e8e6e1;
    --surface: #16161e;
    --border: #2a2a35;
    --accent: #5b8def;
    --muted: #6b6b7b;
    --board-bg: #f5f3ee;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f0eeea;
      --fg: #1a1a1f;
      --surface: #ffffff;
      --border: #d8d5ce;
      --accent: #3d6fd6;
      --muted: #8a8a95;
      --board-bg: #ffffff;
      --check-a: #e625a3;
      --check-b: #6fde3c;
      color-scheme: light;
    }
  }
  :root[data-theme="light"] {
    --bg: #f0eeea;
    --fg: #1a1a1f;
    --surface: #ffffff;
    --border: #d8d5ce;
    --accent: #3d6fd6;
    --muted: #8a8a95;
    --board-bg: #ffffff;
    --check-a: #e8a0c8;
    --check-b: #b5dda4;
    color-scheme: light;
  }

  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: 'DM Sans', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 12px;
    gap: 12px;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
  }

  .header {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    text-align: center;
  }

  .canvas-wrap {
    position: fixed;
    inset: 0;
    z-index: 1;
  }

  canvas#board {
    border-radius: 6px;
    cursor: none;
    touch-action: none;
  }
  #cursor {
    position: fixed;
    pointer-events: none;
    z-index: 50;
    transform: translate(-50%, -50%);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  #cursor .dot {
    width: 8px;
    height: 8px;
    background: #000;
    flex-shrink: 0;
  }
  #cursor .label {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.05em;
    color: var(--fg);
    white-space: nowrap;
    display: none;
    padding: 2px 4px;
  }
  #cursor.on-board .label {
    display: block;
  }
  #cursor.drawing .label {
    display: none;
  }

  .controls {
    position: fixed;
    right: max(16px, env(safe-area-inset-right, 0px));
    top: max(12px, env(safe-area-inset-top, 0px));
    z-index: 10;
  }

  .help-btn {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--muted);
    font-family: 'Space Mono', monospace;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s;
  }
  .help-btn:hover { background: var(--accent); color: #fff; }

  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: max(16px, env(safe-area-inset-left, 0px));
  }
  .modal {
    background: var(--surface);
    border-radius: 12px;
    padding: 28px 24px;
    max-width: 340px;
    width: 100%;
    font-family: 'DM Sans', sans-serif;
    color: var(--fg);
    line-height: 1.6;
  }
  .modal h2 {
    font-family: 'Space Mono', monospace;
    font-size: 13px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 16px;
  }
  .modal p {
    margin: 0 0 12px;
    font-size: 14px;
  }
  .modal p:last-of-type { margin-bottom: 0; }
  .modal strong { color: var(--accent); }
  .modal-close {
    margin-top: 20px;
    width: 100%;
    padding: 8px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--fg);
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.05em;
    cursor: pointer;
    transition: background 0.15s;
  }
  .modal-close:hover { background: var(--accent); color: #fff; }

  .action-btn {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.05em;
    padding: 6px 14px;
    border-radius: 4px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--fg);
    cursor: pointer;
    transition: background 0.15s;
  }
  .action-btn:hover { background: var(--accent); color: #fff; }
  .action-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .pen-size {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.05em;
  }
  .pen-size input[type="range"] {
    width: 80px;
    accent-color: var(--accent);
    writing-mode: vertical-lr;
    direction: rtl;
  }

  .hero-text {
    position: fixed;
    bottom: max(16px, env(safe-area-inset-bottom, 0px));
    left: max(16px, env(safe-area-inset-left, 0px));
    right: max(16px, env(safe-area-inset-right, 0px));
    font-family: 'DM Sans', sans-serif;
    font-weight: 700;
    font-size: 1px;
    line-height: 1;
    width: calc(100vw - max(16px, env(safe-area-inset-left, 0px)) - max(16px, env(safe-area-inset-right, 0px)));
    color: var(--fg);
    pointer-events: none;
    z-index: 0;
    opacity: 0;
    white-space: nowrap;
  }

  .hint {
    font-size: 11px;
    color: var(--muted);
    text-align: center;
    font-family: 'Space Mono', monospace;
    letter-spacing: 0.03em;
  }
</style>

<div class="canvas-wrap">
  <canvas id="board"></canvas>
</div>
<div class="hero-text">PENDULOOM</div>
<div id="cursor"><div class="dot"></div><div class="label">click + hold</div></div>


<script>
(function fitHeroText() {
  const el = document.querySelector('.hero-text');
  function fit() {
    let size = 10;
    el.style.fontSize = size + 'px';
    while (el.scrollWidth <= el.clientWidth && size < 500) {
      size += 2;
      el.style.fontSize = size + 'px';
    }
    el.style.fontSize = (size - 2) + 'px';
  }
  fit();
  window.addEventListener('resize', fit);
})();

(function() {
  const canvas = document.getElementById('board');
  const ctx = canvas.getContext('2d');
  const wrap = canvas.parentElement;

  let W, H;
  let CW, CH;
  let patternCanvas, patternCtx;
  let maskCanvas, maskCtx;
  let compCanvas, compCtx;
  let textStamp, textStampCtx;

  // Bounce physics with drift
  let boardX = 0, boardY = 0;
  let bvx = 1.5, bvy = 1.0;
  let curvature = 0;
  let curvePhase = Math.random() * Math.PI * 2;
  let wavePhaseX = Math.random() * Math.PI * 2;
  let wavePhaseY = Math.random() * Math.PI * 2;

  // Pen state
  let penSize = 12;
  let isDrawing = false;
  let isDragging = false;
  let lastDrawX = null, lastDrawY = null;

  let imageList = [];
  let currentImage = null;

  async function loadManifest() {
    try {
      const resp = await fetch('images/manifest.json');
      const list = await resp.json();
      if (Array.isArray(list) && list.length > 0) {
        imageList = list;
      }
    } catch (e) {}
  }

  function loadRandomImage() {
    return new Promise((resolve) => {
      if (imageList.length === 0) { resolve(null); return; }
      const file = imageList[Math.floor(Math.random() * imageList.length)];
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = () => resolve(null);
      img.src = 'images/' + file;
    });
  }

  function drawImageCover(ctx, img, w, h) {
    const imgAspect = img.naturalWidth / img.naturalHeight;
    const canvasAspect = w / h;
    let sx, sy, sw, sh;
    if (imgAspect > canvasAspect) {
      sh = img.naturalHeight;
      sw = sh * canvasAspect;
      sx = (img.naturalWidth - sw) / 2;
      sy = 0;
    } else {
      sw = img.naturalWidth;
      sh = sw / canvasAspect;
      sx = 0;
      sy = (img.naturalHeight - sh) / 2;
    }
    ctx.drawImage(img, sx, sy, sw, sh, 0, 0, w, h);
  }

  const washColors = ['#e84393', '#6c5ce7', '#00b894', '#fdcb6e', '#e17055', '#74b9ff'];

  function generatePattern() {
    if (currentImage) {
      drawImageCover(patternCtx, currentImage, W, H);
      return;
    }
    // Vivid generative pattern
    const grad = patternCtx.createLinearGradient(0, 0, W, H);
    grad.addColorStop(0, '#1a0533');
    grad.addColorStop(0.5, '#0d1b3e');
    grad.addColorStop(1, '#1a3a2a');
    patternCtx.fillStyle = grad;
    patternCtx.fillRect(0, 0, W, H);

    for (let i = 0; i < 25; i++) {
      const x = Math.random() * W;
      const y = Math.random() * H;
      const r = 40 + Math.random() * Math.min(W, H) * 0.4;
      const g = patternCtx.createRadialGradient(x, y, 0, x, y, r);
      const c = washColors[i % washColors.length];
      g.addColorStop(0, c + 'cc');
      g.addColorStop(0.5, c + '55');
      g.addColorStop(1, 'transparent');
      patternCtx.fillStyle = g;
      patternCtx.beginPath();
      patternCtx.arc(x, y, r, 0, Math.PI * 2);
      patternCtx.fill();
    }
  }

  function initMask() {
    const boardBg = getComputedStyle(document.documentElement).getPropertyValue('--board-bg').trim();
    maskCtx.fillStyle = boardBg;
    maskCtx.fillRect(0, 0, W, H);
  }

  function resize() {
    CW = window.innerWidth;
    CH = window.innerHeight;
    // Board is about 40% of viewport
    const aspect = 4 / 3;
    const targetW = CW * 0.9;
    const targetH = targetW / aspect;
    if (targetH > CH * 0.9) {
      H = Math.floor(CH * 0.9);
      W = Math.floor(H * aspect);
    } else {
      W = Math.floor(targetW);
      H = Math.floor(targetH);
    }

    canvas.width = CW * devicePixelRatio;
    canvas.height = CH * devicePixelRatio;
    canvas.style.width = CW + 'px';
    canvas.style.height = CH + 'px';
    ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);

    const needsInit = !patternCanvas;

    if (!patternCanvas) {
      patternCanvas = document.createElement('canvas');
      patternCtx = patternCanvas.getContext('2d');
      maskCanvas = document.createElement('canvas');
      maskCtx = maskCanvas.getContext('2d');
    }

    patternCanvas.width = W * devicePixelRatio;
    patternCanvas.height = H * devicePixelRatio;
    patternCtx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);

    let oldMaskCanvas = null;
    if (!needsInit) {
      oldMaskCanvas = document.createElement('canvas');
      oldMaskCanvas.width = maskCanvas.width;
      oldMaskCanvas.height = maskCanvas.height;
      oldMaskCanvas.getContext('2d').drawImage(maskCanvas, 0, 0);
    }
    maskCanvas.width = W * devicePixelRatio;
    maskCanvas.height = H * devicePixelRatio;
    maskCtx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);

    generatePattern();

    initMask();
    if (oldMaskCanvas) {
      maskCtx.drawImage(oldMaskCanvas, 0, 0, oldMaskCanvas.width, oldMaskCanvas.height, 0, 0, W, H);
    }
  }

  function initBoardPos() {
    boardX = (CW - W) / 2;
    boardY = (CH - H) / 2;
  }

  function boardOffset() {
    return { x: boardX, y: boardY };
  }

  function updatePhysics(dt) {
    const step = Math.min(dt, 0.033);
    const speed = 50;

    // Gentle rotation of velocity vector for curved paths
    curvePhase += step * 0.4;
    curvature = Math.sin(curvePhase) * 0.3 * step;
    const cos = Math.cos(curvature), sin = Math.sin(curvature);
    const nvx = bvx * cos - bvy * sin;
    const nvy = bvx * sin + bvy * cos;
    bvx = nvx;
    bvy = nvy;

    // Keep speed consistent
    const mag = Math.sqrt(bvx * bvx + bvy * bvy);
    if (mag > 0.01) { bvx /= mag; bvy /= mag; }

    // Sinusoidal wobble on both axes
    wavePhaseX += step * 1.7;
    wavePhaseY += step * 2.3;
    const wobbleX = Math.sin(wavePhaseX) * 30 * step;
    const wobbleY = Math.sin(wavePhaseY) * 25 * step;

    boardX += bvx * speed * step + wobbleX;
    boardY += bvy * speed * step + wobbleY;

    // Bounce off edges with slight angle variation
    if (boardX <= 0) { boardX = 0; bvx = Math.abs(bvx); bvy += (Math.random() - 0.5) * 0.3; }
    if (boardX + W >= CW) { boardX = CW - W; bvx = -Math.abs(bvx); bvy += (Math.random() - 0.5) * 0.3; }
    if (boardY <= 0) { boardY = 0; bvy = Math.abs(bvy); bvx += (Math.random() - 0.5) * 0.3; }
    if (boardY + H >= CH) { boardY = CH - H; bvy = -Math.abs(bvy); bvx += (Math.random() - 0.5) * 0.3; }
  }

  function eraseMask(x0, y0, x1, y1) {
    maskCtx.save();
    maskCtx.globalCompositeOperation = 'destination-out';
    maskCtx.strokeStyle = 'rgba(255,255,255,1)';
    maskCtx.lineWidth = penSize;
    maskCtx.lineCap = 'round';
    maskCtx.lineJoin = 'round';
    maskCtx.beginPath();
    maskCtx.moveTo(x0, y0);
    maskCtx.lineTo(x1, y1);
    maskCtx.stroke();
    maskCtx.restore();
  }

  function eraseDot(x, y) {
    maskCtx.save();
    maskCtx.globalCompositeOperation = 'destination-out';
    maskCtx.fillStyle = 'rgba(255,255,255,1)';
    maskCtx.beginPath();
    maskCtx.arc(x, y, penSize / 2, 0, Math.PI * 2);
    maskCtx.fill();
    maskCtx.restore();
  }

  function render() {
    ctx.clearRect(0, 0, CW, CH);

    const off = boardOffset();

    ctx.save();
    ctx.translate(off.x, off.y);

    const boardBg = getComputedStyle(document.documentElement).getPropertyValue('--board-bg').trim();
    const radius = 60;

    // Drop shadow — use board-bg color so no dark fill bleeds through
    ctx.shadowColor = 'rgba(0,0,0,0.25)';
    ctx.shadowBlur = 30;
    ctx.shadowOffsetX = 0;
    ctx.shadowOffsetY = 8;
    ctx.fillStyle = boardBg;
    ctx.beginPath();
    ctx.roundRect(0, 0, W, H, radius);
    ctx.fill();
    ctx.shadowColor = 'transparent';

    ctx.beginPath();
    ctx.roundRect(0, 0, W, H, radius);
    ctx.clip();

    // Draw the hidden pattern
    ctx.drawImage(patternCanvas, 0, 0, patternCanvas.width, patternCanvas.height, 0, 0, W, H);

    // Build composited mask: start with user's mask, then punch out text and cursor
    if (!compCanvas) {
      compCanvas = document.createElement('canvas');
      compCtx = compCanvas.getContext('2d');
    }
    compCanvas.width = W * devicePixelRatio;
    compCanvas.height = H * devicePixelRatio;
    compCtx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
    compCtx.drawImage(maskCanvas, 0, 0, maskCanvas.width, maskCanvas.height, 0, 0, W, H);




    // Punch through cursor label rectangle when hovering
    const labelEl = document.querySelector('#cursor .label');
    if (!isDrawing && !isDragging && labelEl && labelEl.offsetWidth > 0) {
      const labelRect = labelEl.getBoundingClientRect();
      const canvasRect = canvas.getBoundingClientRect();
      const lx = labelRect.left - canvasRect.left - off.x;
      const ly = labelRect.top - canvasRect.top - off.y;
      const lw = labelRect.width;
      const lh = labelRect.height;
      if (lx + lw > 0 && lx < W && ly + lh > 0 && ly < H) {
        compCtx.save();
        compCtx.globalCompositeOperation = 'destination-out';
        compCtx.fillStyle = 'rgba(255,255,255,1)';
        compCtx.beginPath();
        compCtx.roundRect(lx - 4, ly - 2, lw + 8, lh + 4, 2);
        compCtx.fill();
        compCtx.restore();
      }
    }

    // Draw composited mask on top of pattern
    ctx.drawImage(compCanvas, 0, 0, compCanvas.width, compCanvas.height, 0, 0, W, H);

    ctx.restore();

    // Draw PENDULOOM: reveals image where board overlaps, normal text elsewhere
    const heroText = document.querySelector('.hero-text');
    if (heroText) {
      const hr = heroText.getBoundingClientRect();
      const cr = canvas.getBoundingClientRect();
      const fs = parseFloat(getComputedStyle(heroText).fontSize);
      const txtX = hr.left - cr.left;
      const txtY = hr.top - cr.top;
      const fg = getComputedStyle(document.documentElement).getPropertyValue('--fg').trim();

      // Render text stamp ONCE with fg color
      if (!textStamp) {
        textStamp = document.createElement('canvas');
        textStampCtx = textStamp.getContext('2d');
      }
      textStamp.width = CW * devicePixelRatio;
      textStamp.height = CH * devicePixelRatio;
      textStampCtx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
      textStampCtx.font = `700 ${fs}px 'DM Sans', sans-serif`;
      textStampCtx.fillStyle = fg;
      textStampCtx.fillText('PENDULOOM', txtX, txtY + fs * 0.82);

      // 1) Cut text shape out of board (any opaque pixel cuts)
      ctx.save();
      ctx.globalCompositeOperation = 'destination-out';
      ctx.drawImage(textStamp, 0, 0, textStamp.width, textStamp.height, 0, 0, CW, CH);
      ctx.restore();

      // 2) Fill pattern into the holes (only where board overlaps)
      ctx.save();
      ctx.globalCompositeOperation = 'destination-over';
      ctx.translate(off.x, off.y);
      ctx.beginPath();
      ctx.roundRect(0, 0, W, H, radius);
      ctx.clip();
      ctx.drawImage(patternCanvas, 0, 0, patternCanvas.width, patternCanvas.height, 0, 0, W, H);
      ctx.restore();

      // 3) Same stamp behind everything (visible where no board)
      ctx.save();
      ctx.globalCompositeOperation = 'destination-over';
      ctx.drawImage(textStamp, 0, 0, textStamp.width, textStamp.height, 0, 0, CW, CH);
      ctx.restore();
    }
  }

  // Interaction
  function isNearCorner(bx, by) {
    const zone = Math.min(W, H) * 0.2;
    const corners = [[0,0],[W,0],[0,H],[W,H]];
    for (const [cx, cy] of corners) {
      const dx = bx - cx, dy = by - cy;
      if (dx * dx + dy * dy < zone * zone) return true;
    }
    return false;
  }

  function onPointerDown(e) {
    if (e.button !== 0) return;
    canvas.setPointerCapture(e.pointerId);
    penScreenX = e.clientX;
    penScreenY = e.clientY;

    const rect = canvas.getBoundingClientRect();
    const off = boardOffset();
    const bx = penScreenX - rect.left - off.x;
    const by = penScreenY - rect.top - off.y;

    if (bx >= 0 && bx <= W && by >= 0 && by <= H && isNearCorner(bx, by)) {
      isDragging = true;
      bvx = 0;
      bvy = 0;
    } else {
      isDrawing = true;
      lastDrawX = bx;
      lastDrawY = by;
      eraseDot(bx, by);
    }
  }

  function onPointerMove(e) {
    const prevX = penScreenX, prevY = penScreenY;
    penScreenX = e.clientX;
    penScreenY = e.clientY;

    if (isDragging) {
      boardX += penScreenX - prevX;
      boardY += penScreenY - prevY;
    }
  }

  function onPointerUp(e) {
    if (isDragging) {
      bvx = cursorVelX * 0.05;
      bvy = cursorVelY * 0.05;
      // Normalize so speed stays consistent
      const mag = Math.sqrt(bvx * bvx + bvy * bvy);
      if (mag > 0.1) { bvx /= mag; bvy /= mag; }
      else { bvx = 1.2; bvy = 0.8; }
      isDragging = false;
    }
    isDrawing = false;
    lastDrawX = null;
    lastDrawY = null;
  }

  canvas.addEventListener('pointerdown', onPointerDown);
  canvas.addEventListener('pointermove', onPointerMove);
  canvas.addEventListener('pointerup', onPointerUp);
  canvas.addEventListener('pointercancel', onPointerUp);

  let penScreenX = 0, penScreenY = 0;
  let prevScreenX = 0, prevScreenY = 0;
  let cursorVelX = 0, cursorVelY = 0;

  const cursorEl = document.getElementById('cursor');
  document.addEventListener('mousemove', (e) => {
    cursorEl.style.left = e.clientX + 'px';
    cursorEl.style.top = e.clientY + 'px';
  });

  function updateCursor() {
    if (isDrawing || isDragging) {
      cursorEl.className = '';
      return;
    }
    const rect = canvas.getBoundingClientRect();
    const off = boardOffset();
    const bx = penScreenX - rect.left - off.x;
    const by = penScreenY - rect.top - off.y;
    if (bx >= 0 && bx <= W && by >= 0 && by <= H) {
      cursorEl.className = 'on-board';
    } else {
      cursorEl.className = '';
    }
  }

  // Main loop
  let lastTime = performance.now();

  function loop(now) {
    const dt = (now - lastTime) / 1000;
    lastTime = now;

    cursorVelX = penScreenX - prevScreenX;
    cursorVelY = penScreenY - prevScreenY;
    prevScreenX = penScreenX;
    prevScreenY = penScreenY;

    if (!isDragging) updatePhysics(dt);
    const offAfter = boardOffset();

    if (isDrawing && lastDrawX !== null) {
      const rect = canvas.getBoundingClientRect();
      const cursorBoardX = penScreenX - rect.left - offAfter.x;
      const cursorBoardY = penScreenY - rect.top - offAfter.y;
      eraseMask(lastDrawX, lastDrawY, cursorBoardX, cursorBoardY);
      lastDrawX = cursorBoardX;
      lastDrawY = cursorBoardY;
    }

    render();
    updateCursor();
    requestAnimationFrame(loop);
  }

  async function init() {
    await loadManifest();
    currentImage = await loadRandomImage();
    resize();
    initBoardPos();
    window.addEventListener('resize', resize);
    requestAnimationFrame(loop);
  }
  init();
})();
</script>
